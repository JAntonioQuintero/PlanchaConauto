# Inventario para ejecutar el planchado desde Semaphore UI.
# El servidor Semaphore / Ansible controller se encuentra en 172.20.54.160.
# Este inventario NO debe apuntar a Producción; solo al destino QA.

[planchado_conauto]
conauto-qa ansible_host=172.20.54.217 ansible_user=semaphore_ops

[planchado_conauto:vars]
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3

# Referencia documental. El playbook no ejecuta tareas directas sobre estos grupos.
[servidor_semaphore]
semaphore-ui ansible_host=172.20.54.160 ansible_connection=local

[servidor_respaldos_produccion]
prod-respaldos ansible_host=172.20.54.202 ansible_user=backup_reader
