# Inventario para ejecutar el planchado desde Semaphore UI.
# El servidor Semaphore / Ansible controller se encuentra en 172.20.54.160.
# Este inventario NO debe apuntar a Producción; solo al destino QA.

[planchado_conauto]
conauto-qa ansible_host=172.20.54.217 ansible_user=semaphore

[planchado_conauto:vars]
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
